# /etc/pi-player/config.toml — pi-player configuration. Restart after editing:
#   sudo systemctl restart pi-player

# CMS base URL. Device token lives in <state_dir>/token (written by pairing).
cms_url = "http://localhost:8080"
# Manifest poll (seconds): how fast a new version or group moment reaches this screen. The
# heartbeat to the CMS also goes out every 30 s.
manifest_poll = 30
# Network lost while playing: keep playing this long (seconds), then show the wifi-setup screen.
offline_timeout = 600
# While the wifi-setup hotspot is up: every this many seconds drop it briefly and try the saved
# wifi networks again (postponed while someone is using the setup page).
wifi_retry = 120
# Time source for chrony (sync between screens depends on it). Empty = the distro's internet
# pool. Set a LAN host (e.g. "192.168.1.10") so all screens share one clock; applied by
# install.sh as /etc/chrony/conf.d/pi-player.conf -> re-run `sudo ./install.sh` after changing.
ntp_server = ""
# Optional logo (PNG) shown top-left on the setup screens.
logo = "/etc/pi-player/logo.png"

# Where the agent keeps token, videos and state.
state_dir = "/var/lib/pi-player"
# Video to play. Defaults to <state_dir>/current.mp4 when empty.
video = ""

# Sync reference: frame 0 plays at epoch + k*duration (Unix seconds). The manifest overrides this.
epoch = 0

# HDMI mode, written to the kernel cmdline by install.sh (re-run it + reboot after changing).
# Smoothest when the refresh rate is a multiple of the video fps: @60 for 30 fps, @50 for
# 25 fps. Many PC monitors reject @50 ("Out of range"); TVs accept both. Empty = leave alone.
display_mode = "1920x1080@60"
# GStreamer video sink (plus properties). Pi: "kmssink"; e.g. "kmssink connector-id=32" when
# more than one HDMI output is connected. Dev machine: "autovideosink".
video_sink = "kmssink"
# Screens hung upright (CMS "Stand van het scherm" 90/270): how the picture is turned.
# "gl" = on the GPU (frames into GL, glvideoflip, shown by gl_sink via GBM/KMS); falls back to
# "cpu" (videoflip) by itself when GL is missing or fails to start. Landscape screens never turn.
rotate_method = "gl"
gl_sink = "glimagesink"

# Frame timing is locked to the system clock by GStreamer; this is only a safety net.
[sync]
interval = 1.0        # how often to check the position (s)
seek_threshold = 0.5  # |drift| above this (s; clock stepped, pipeline stalled): re-join the clock
